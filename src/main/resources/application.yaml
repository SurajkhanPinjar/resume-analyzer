server:
  port: 8089

spring:
  application:
    name: resume-analyzer

  # ===============================
  # FILE UPLOAD
  # ===============================
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  # ===============================
  # DATASOURCE (H2 FILE MODE)
  # ===============================
  datasource:
    url: jdbc:h2:file:./data/resume_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # ⛔ TEMPORARY (see note below)
    show-sql: true
    open-in-view: false

  # ===============================
  # H2 CONSOLE
  # ===============================
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  # ===============================
  # THYMELEAF
  # ===============================
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# ===============================
# LOGGING
# ===============================
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# ===============================
# APP CONFIG
# ===============================
app:
  file:
    upload-dir: uploads/
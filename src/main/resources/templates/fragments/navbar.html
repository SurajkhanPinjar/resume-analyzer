<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">
        Resume Ranker AI
    </a>

    <!-- TOGGLER -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-center">

            <!-- IF USER LOGGED IN -->
            <li class="nav-item me-3 text-light small"
                th:if="${session.user != null}">
                <span>
                    Plan: <strong th:text="${session.user.plan}">Starter</strong>
                </span>
            </li>

            <li class="nav-item me-2"
                th:if="${session.user != null}">
                <a class="btn btn-sm btn-outline-warning" href="#">
                    Upgrade
                </a>
            </li>

            <li class="nav-item"
                th:if="${session.user != null}">
                <a class="nav-link" th:href="@{/upload}">
                    Upload
                </a>
            </li>

            <li class="nav-item"
                th:if="${session.user != null}">
                <a class="nav-link text-danger" th:href="@{/logout}">
                    Logout
                </a>
            </li>

            <!-- IF USER NOT LOGGED IN -->
            <li class="nav-item"
                th:if="${session.user == null}">
                <a class="nav-link" th:href="@{/login}">
                    Login
                </a>
            </li>

            <li class="nav-item"
                th:if="${session.user == null}">
                <a class="btn btn-sm btn-outline-light ms-2"
                   th:href="@{/signup}">
                    Sign Up
                </a>
            </li>

        </ul>
    </div>
</nav>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Usage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">
        Resume Ranker AI
    </a>

    <!-- TOGGLER (FIX) -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/upload}">Upload</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/usage}">
                    Usage
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">Your Usage</h3>

    <div class="row">
        <div class="col-md-6">

            <ul class="list-group shadow-sm">
                <li class="list-group-item d-flex justify-content-between">
                    <span>Plan</span>
                    <strong>Starter</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Resumes Used</span>
                    <strong>40 / 100</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>ZIP Uploads Used</span>
                    <strong>3 / 10</strong>
                </li>
            </ul>

            <div class="mt-4">
                <a th:href="@{/upload}" class="btn btn-primary">
                    Upload More Resumes
                </a>

                <button class="btn btn-outline-secondary ms-2">
                    Upgrade Plan
                </button>
            </div>

        </div>
    </div>
</div>

<!-- BOOTSTRAP JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

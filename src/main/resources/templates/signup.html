<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sign Up | Resume Ranker AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">
        Resume Ranker AI
    </a>
</nav>

<!-- SIGNUP CARD -->
<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg border-0" style="width: 420px;">
        <div class="card-body p-4">

            <h3 class="fw-bold text-center mb-2">
                Create your account 🚀
            </h3>

            <p class="text-muted text-center mb-4">
                Start ranking resumes in minutes
            </p>

            <!-- ✅ ERROR MESSAGE -->
            <div
                    class="alert alert-danger text-center"
                    th:if="${param.error}">
                Email already exists. Please login instead.
            </div>

            <!-- SIGNUP FORM -->
            <form th:action="@{/signup}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Email address
                    </label>
                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="you@example.com"
                            required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Password
                    </label>
                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Minimum 6 characters"
                            minlength="6"
                            required>
                </div>

                <button
                        type="submit"
                        class="btn btn-primary w-100 mt-2">
                    Sign Up
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">
                    Already have an account?
                </span>
                <a th:href="@{/login}" class="fw-semibold text-decoration-none">
                    Login
                </a>
            </div>

        </div>
    </div>
</div>

<!-- BOOTSTRAP JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

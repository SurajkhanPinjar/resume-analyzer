<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Resumes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- COMMON NAVBAR -->
<div th:replace="~{fragments/navbar :: body}"></div>

<!-- CONTENT -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">Upload Resumes</h3>

    <form id="uploadForm" novalidate>

        <!-- RESUME FILE INPUT -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Upload Resumes (PDF or ZIP)
            </label>
            <input
                    type="file"
                    class="form-control"
                    id="files"
                    accept=".pdf,.zip"
                    multiple
                    required>
            <div class="form-text">
                Upload multiple PDFs OR a single ZIP file
            </div>
            <div class="form-text text-warning">
                ZIP must be uploaded alone
            </div>
        </div>

        <!-- JD TYPE SELECTION -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Job Description Type
            </label>

            <div class="form-check">
                <input
                        class="form-check-input"
                        type="radio"
                        name="jdType"
                        id="jdTextOption"
                        value="text"
                        checked>
                <label class="form-check-label" for="jdTextOption">
                    Paste JD as Text
                </label>
            </div>

            <div class="form-check">
                <input
                        class="form-check-input"
                        type="radio"
                        name="jdType"
                        id="jdFileOption"
                        value="file">
                <label class="form-check-label" for="jdFileOption">
                    Upload JD as TXT file
                </label>
            </div>
        </div>

        <!-- JD TEXT -->
        <div class="mb-3" id="jdTextBlock">
            <label class="form-label fw-semibold">
                Job Description (Text)
            </label>
            <textarea
                    class="form-control"
                    id="jdText"
                    rows="6"
                    required
                    placeholder="Paste full job description here"></textarea>
        </div>

        <!-- JD FILE -->
        <div class="mb-3 d-none" id="jdFileBlock">
            <label class="form-label fw-semibold">
                Upload Job Description (TXT)
            </label>
            <input
                    type="file"
                    class="form-control"
                    id="jdFile"
                    accept=".txt">
            <div class="form-text">
                Upload a plain text JD file
            </div>
        </div>

        <!-- CONFIDENCE -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Minimum Confidence
            </label>
            <input
                    type="number"
                    class="form-control"
                    id="minConfidence"
                    value="0.6"
                    step="0.1"
                    min="0"
                    max="1">
            <div class="form-text">
                Candidates below this confidence will be filtered out
            </div>
        </div>

        <!-- SUBMIT -->
        <button class="btn btn-primary" type="submit">
            Process & Download Excel
        </button>

        <!-- LOADER -->
        <div id="loader" class="mt-3 text-muted d-none">
            Processing… please wait ⏳
        </div>

        <!-- ERROR (future use) -->
        <div id="error" class="alert alert-danger mt-3 d-none"></div>

    </form>
</div>

<!-- JS -->
<script src="/js/upload.js"></script>

<!-- JD TOGGLE -->
<script>
    const jdTextOption = document.getElementById("jdTextOption");
    const jdFileOption = document.getElementById("jdFileOption");
    const jdTextBlock = document.getElementById("jdTextBlock");
    const jdFileBlock = document.getElementById("jdFileBlock");
    const jdText = document.getElementById("jdText");
    const jdFile = document.getElementById("jdFile");

    function toggleJdInput() {
        if (jdTextOption.checked) {
            jdTextBlock.classList.remove("d-none");
            jdFileBlock.classList.add("d-none");
            jdText.required = true;
            jdFile.required = false;
            jdFile.value = "";
        } else {
            jdTextBlock.classList.add("d-none");
            jdFileBlock.classList.remove("d-none");
            jdText.required = false;
            jdFile.required = true;
            jdText.value = "";
        }
    }

    jdTextOption.addEventListener("change", toggleJdInput);
    jdFileOption.addEventListener("change", toggleJdInput);
</script>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

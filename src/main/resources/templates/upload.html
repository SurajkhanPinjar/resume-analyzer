<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Upload Resumes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- COMMON NAVBAR -->
<div th:replace="fragments/navbar :: body"></div>

<!-- CONTENT -->
<div class="container mt-5">
    <h3 class="fw-bold mb-4">Upload Resumes</h3>

    <form id="uploadForm">

        <!-- FILE INPUT -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Upload Resumes (PDF or ZIP)
            </label>
            <input
                    type="file"
                    class="form-control"
                    id="files"
                    accept=".pdf,.zip"
                    multiple
                    required>
            <div class="form-text">
                You can upload multiple PDFs or a single ZIP file.
            </div>
        </div>

        <!-- JD -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Job Description (JSON)
            </label>
            <textarea
                    class="form-control"
                    id="jd"
                    rows="6"
                    required>{
  "role": "Backend Engineer",
  "requiredSkills": ["Java", "Spring Boot", "Kafka"]
}
            </textarea>
        </div>

        <!-- CONFIDENCE -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                Minimum Confidence
            </label>
            <input
                    type="number"
                    class="form-control"
                    id="minConfidence"
                    value="0.6"
                    step="0.1"
                    min="0"
                    max="1">
            <div class="form-text">
                Candidates below this confidence will be filtered out.
            </div>
        </div>

        <!-- SUBMIT -->
        <button
                class="btn btn-primary"
                type="submit"
                id="submitBtn">
            Process & Download Excel
        </button>

        <!-- LOADER -->
        <div id="loader" class="mt-3 text-muted d-none">
            Processing… please wait ⏳
        </div>

        <!-- ERROR -->
        <div id="error" class="alert alert-danger mt-3 d-none"></div>

    </form>
</div>

<!-- JS -->
<script src="/js/upload.js"></script>

<!-- BOOTSTRAP JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>

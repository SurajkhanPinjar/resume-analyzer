<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login | Resume Ranker AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" th:href="@{/}">
        Resume Ranker AI
    </a>
</nav>

<!-- LOGIN CARD -->
<div class="container d-flex justify-content-center align-items-center"
     style="min-height: calc(100vh - 56px);">

    <div class="card shadow-lg border-0" style="width: 420px;">
        <div class="card-body p-4">

            <h3 class="text-center fw-bold mb-2">Welcome Back 👋</h3>
            <p class="text-center text-muted mb-4">
                Login to continue using Resume Ranker AI
            </p>

            <!-- ERROR MESSAGE -->
            <div th:if="${error}" class="alert alert-danger text-center">
                Invalid email or password
            </div>

            <!-- LOGIN FORM -->
            <form method="post" th:action="@{/login}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="you@example.com"
                            required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="••••••••"
                            required>
                </div>

                <button
                        type="submit"
                        class="btn btn-primary w-100 mt-3">
                    Login
                </button>
            </form>

            <!-- SIGNUP LINK -->
            <div class="text-center mt-4">
                <span class="text-muted">New here?</span>
                <a th:href="@{/signup}" class="fw-semibold text-decoration-none">
                    Create an account
                </a>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
